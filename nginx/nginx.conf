user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/gallery_error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Định dạng log chi tiết phục vụ Promtail + Loki
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    # Ghi đồng thời ra file thực cho Promtail và ra stdout cho Docker logs
    access_log  /var/log/nginx/gallery_access.log  main;
    access_log  /dev/stdout  main;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off; # Ẩn phiên bản Nginx (Hardening)

    include /etc/nginx/conf.d/*.conf;
}
