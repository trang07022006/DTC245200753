server {
    listen 80;
    server_name localhost;

    # Giới hạn kích thước gói tin tải lên (10MB) đồng bộ với PHP
    client_max_body_size 10M;

    # Security Headers bảo vệ ứng dụng (Hardening)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 1. Chặn tuyệt đối truy cập trực tiếp vào thư mục uploads
    # Toàn bộ việc xem ảnh phải qua script kiểm tra quyền/token
    location /uploads/ {
        deny all;
        return 403;
    }

    # 2. Chặn các file ẩn (.env, .git, .htaccess)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 3. Endpoint thống kê trạng thái Nginx cho Prometheus exporter (nội bộ Docker)
    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # 4. Chuyển tiếp (Reverse Proxy) tất cả request còn lại sang container App
    location / {
        proxy_pass http://app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
