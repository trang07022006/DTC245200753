# Đề 31: Hệ thống Thư viện Ảnh Gallery
# Docker Compose Orchestration (compose.yaml) - Tích hợp Monitoring
# -------------------------------------------------------------

name: gallery-dtc245200753

services:
  # 1. Cơ sở dữ liệu MySQL 8.0
  mysql:
    image: mysql:8.0.36
    container_name: gallery_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    # Không publish cổng 3306 ra ngoài máy chủ để đảm bảo an toàn (Hardening)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 2. Ứng dụng Gallery Backend (PHP 8.2 + Apache)
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: gallery_app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES}
    volumes:
      - uploads_data:/var/www/html/uploads
    networks:
      - frontend
      - backend
    depends_on:
      mysql:
        condition: service_healthy

  # 3. Giao diện quản trị Database phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    container_name: gallery_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # Bind vào localhost để tránh mở công khai ra ngoài mạng (Hardening)
      - "127.0.0.1:${PMA_PORT:-8082}:80"
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy

  # 4. Nginx Reverse Proxy (Cổng vào duy nhất tiếp nhận HTTP từ Client)
  nginx:
    image: nginx:1.25.5-alpine
    container_name: gallery_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - frontend
      - monitoring
    depends_on:
      - app

  # -------------------------------------------------------------
  # HỆ THỐNG GIÁM SÁT (MONITORING STACK - PROMETHEUS & EXPORTERS)
  # -------------------------------------------------------------

  # 5. Nginx Prometheus Exporter (Thu thập số liệu Web Server từ /stub_status)
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: gallery_nginx_exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    networks:
      - monitoring
    depends_on:
      - nginx

  # 6. MySQLd Exporter (Thu thập số liệu CSDL với quyền tối thiểu)
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: gallery_mysqld_exporter
    restart: unless-stopped
    command:
      - --config.my-cnf=/etc/mysqld_exporter/.my.cnf
    volumes:
      - ./monitoring/mysqld_exporter/.my.cnf:/etc/mysqld_exporter/.my.cnf:ro
    networks:
      - backend
      - monitoring
    depends_on:
      mysql:
        condition: service_healthy

  # 7. cAdvisor (Thu thập tài nguyên phần cứng CPU/RAM của các Container)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: gallery_cadvisor
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring

  # 8. Prometheus Server (Thu thập và lưu trữ Time-Series Metrics)
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: gallery_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
    depends_on:
      - nginx-exporter
      - mysqld-exporter
      - cadvisor

  # 9. Grafana (Trực quan hóa Dashboards)
  grafana:
    image: grafana/grafana:10.4.2
    container_name: gallery_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: Admin@Grafana2026!
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  mysql_data:
    name: gallery_mysql_data
  uploads_data:
    name: gallery_uploads_data
  prometheus_data:
    name: gallery_prometheus_data
  grafana_data:
    name: gallery_grafana_data
